<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css" />
  <title>CV</title>
</head>
<body>
  <header>
    <div class="header-info">
      <div class="header-info-cv">
        <img src="cv-grey.svg" alt="icon-cv" class="icon-cv" />
        <p class="vacancy">Junior Frontend Developer</p>
      </div>
      <div class="header-info-main">
        <p class="name">Tsepeleva Anna</p>
        <nav class="nav">
          <ul class="nav-list">
            <li class="nav-item"><a href="#contacts" class="nav-link">Contacts</a></li>
            <li class="nav-item"><a href="#summary" class="nav-link">Summary</a></li>
            <li class="nav-item"><a href="#skills" class="nav-link">Skills</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>
  <main>
    <div class="main-container">
      <div class="main-left">
        <div class="first-block">
          <div class="ava">
            <img src="./assets/img/photo.jpg" alt="my-photo" class="ava_photo" />
          </div>
        </div>
        <div class="second-block">
          <div class="education">education</div>
            
        </div>
        <div class="third-block">
          <div class="smth">smth
            
          </div>
        </div>
        <div class="fouth-block">
          <div class="languages">languages
            
          </div>
        </div>
      </div>
      <div class="main-info">
        <div class="first-block">
          <div class="contacts">contacts
            
          </div>
        </div>
        <div class="second-block">
          <div class="about">about me
            
          </div>
        </div>
        <div class="third-block">
          <div class="skills">skills
            
          </div>
        </div>
        <div class="fouth-block">
          <div class="code">code example
            
          </div>
        </div>
      </div>
      <div class="experience">experience</div>
    </div>
  </main>
</body>
</html>
